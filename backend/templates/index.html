<!DOCTYPE html>
<html>
<head>
    <title>PPE Monitoring Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
        }

        .top-bar {
            background: #1f2937;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-btn {
            padding: 8px 16px;
            background: #ef4444;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .grid {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .cam-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .cam-card h3 {
            margin-top: 0;
        }

        .cam-card img {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        select {
            padding: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

<div class="top-bar">
    <h2>PPE Monitoring Dashboard</h2>
    <a href="/alerts">
        <button class="alert-btn">⚠ Alerts</button>
    </a>
</div>

<div class="grid">

{% for i in range(1,5) %}
<div class="cam-card">
    <h3>Camera {{ i }}</h3>

    <form action="/set_zone" method="POST">
        <input type="hidden" name="camera_id" value="{{ i }}">
        <b>Zone:</b>
        <select name="zone" onchange="this.form.submit()">
            {% for zone in ["Excavation","Welding","Height","Cement","None"] %}
            <option value="{{ zone }}"
            {% if camera_zones[i] == zone %}selected{% endif %}>
            {{ zone }}
            </option>
            {% endfor %}
        </select>
    </form>

    <img src="/video/{{ i }}">
</div>
{% endfor %}

</div>

</body>
</html>
