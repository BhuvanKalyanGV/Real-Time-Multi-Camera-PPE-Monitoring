<!DOCTYPE html>
<html>
<head>
    <title>PPE Alerts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 8px 15px;
            border-radius: 6px;
        }

        .filter-bar {
            padding: 20px;
            text-align: center;
        }

        .filter-bar button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: #e5e7eb;
            transition: 0.3s;
        }

        .filter-bar button.active,
        .filter-bar button:hover {
            background: #2563eb;
            color: white;
        }

        .alerts-container {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .alert-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .alert-card:hover {
            transform: translateY(-5px);
        }

        .alert-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            cursor: pointer;
        }

        .alert-content {
            padding: 15px;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            background: red;
            color: white;
            border-radius: 20px;
            font-size: 12px;
        }

        .info-row {
            margin-top: 8px;
            font-size: 14px;
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

    </style>
</head>
<body>

<div class="header">
    <h2>⚠ PPE Violation Alerts</h2>
    <a href="/" class="back-btn">⬅ Dashboard</a>
</div>

<div class="filter-bar">
    <button onclick="filterCamera('ALL')" class="active">All</button>
    <button onclick="filterCamera('CAM_1')">Cam 1</button>
    <button onclick="filterCamera('CAM_2')">Cam 2</button>
    <button onclick="filterCamera('CAM_3')">Cam 3</button>
    <button onclick="filterCamera('CAM_4')">Cam 4</button>
</div>

<div class="alerts-container">
    {% for alert in alerts %}
    <div class="alert-card" data-camera="{{ alert.camera }}">
        <img src="{{ url_for('static', filename=alert.snapshot) }}" onclick="openLightbox(this)">
        <div class="alert-content">
            <span class="badge">{{ alert.violation }}</span>

            <div class="info-row"><b>Person:</b> {{ alert.person_id }}</div>
            <div class="info-row"><b>Camera:</b> {{ alert.camera }}</div>
            <div class="info-row"><b>Zone:</b> {{ alert.zone }}</div>
            <div class="info-row"><b>Time:</b> {{ alert.timestamp }}</div>
        </div>
    </div>
    {% endfor %}
</div>

<div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
</div>

<script>
function filterCamera(camera) {
    document.querySelectorAll('.filter-bar button').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    document.querySelectorAll('.alert-card').forEach(card => {
        if (camera === 'ALL' || card.dataset.camera === camera) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}

function openLightbox(img) {
    document.getElementById("lightbox-img").src = img.src;
    document.getElementById("lightbox").style.display = "flex";
}

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
